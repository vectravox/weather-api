[project]
name = "weather-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.1",
    "apscheduler>=3.11.3",
    "fastapi>=0.139.0",
    "ruff>=0.15.21",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.ruff.lint]
extend-select = [
    "B",
    "C4",
    "D",
    "I",
    "RUF",
    "SIM",
    "UP",
]
ignore = ["B008", "D203", "D211", "D213"]
